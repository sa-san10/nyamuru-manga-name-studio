# ============================================================
# 『コマが狭いのです』— ぶち抜き配置のデモ（1ページ・6コマ）
# Open Manga Name YAML (OMNY) / Nyamuru Data Model (NDM) v10.31 ／ 標準OMAY v10.7
# ------------------------------------------------------------
# 🫧 6コマ目（id6）がぶち抜きコマ。bg: -1 を「背景処理のプレースホルダー」として使い、
#    action の先頭の一文で「背景も枠線も描かず、人物とフキダシだけを最前面に重ねる」に上書きしている。
#    id は昇順で奥→手前なので、最後の id6 が一番手前に重なる（最後に読むコマでもある）。
#    奥の id3〜id5 は action で「ページの左端から描き、id6 の下に回り込む」と書き、
#    人物・フキダシ・ホワイトボードは id6 に隠れない右側に置いている。
# ============================================================

manga:
  schema_name: "Nyamuru Data Model"
  schema_version: 10.31
  meta:
    title: "コマが狭いのです"
    author: "にゃむるたん © sa-san10 / CC BY 4.0"
    format: "カラー漫画"
    page_count: 1
    reading_direction: "right-to-left"
    text_orientation: "vertical"
    font: "アンチック体"
    style_notes:
      - "🚫 商標の回避: この作品は公開リポジトリに掲載される。実在の製品名・型番・企業名・ロゴを絵の中に一切描かない。古い電子機器は名前ではなく形と素材で描く——ベージュに黄ばんだ樹脂の箱型本体（前面に薄い四角い差し込み口が2つ縦に並ぶ）／黒い縦長の筐体／奥行きの深いガラス画面の表示装置（後ろが大きく出っぱっている）／分厚い樹脂のキーボード／剥き出しの緑色の基板／束ねた灰色のケーブル。筐体・キーボード・基板・段ボール箱・値札・看板に実在のメーカー名やロゴを描かない。文字を入れるなら、この作品オリジナルの店名『ヌルポ』か、意味のない型番風の記号（JV-0026 / TYPE-B など）だけにする。⚠️ 画面に映すのは screen_text に書かれた文字だけで、実在のサービスの画面デザインやロゴは描かない"
      - "舞台は秋葉原の路地裏のジャンクショップ「ヌルポ」の店内。積まれた古いブラウン管（CRT）モニター、古いPC、床を這うケーブル。雑多だけど温かい空間"
      - "にゃむるたん：黄オレンジのショートヘアに猫耳、[ ]形のヘアクリップ、エメラルドグリーンの瞳、首の大きな鈴、ピンクのミニメイド服に猫顔チャームとNマークの白エプロン、黄色ボーダーのニーハイ、肉球手袋と肉球シューズ、先に白いリボンの尻尾。全コマでこの姿を省略しない"
      - "らきもたん：水色のショートボブに大きなアホ毛、赤い文字列が走る黒い大リボン、青いメイド服に白エプロンの赤い「R」、再生ボタン（▶）のベルトバックル、白いニーハイ。驚くとピクセル状のパーティクルやグリッチノイズが散る。全コマでこの姿を省略しない"
      - "ぶち抜き演出：6コマ目は、ページ左寄りに縦長に重ねる手前のコマ（3〜5コマ目の上に重なる。1・2コマ目には重ならない）。このコマは背景・白マージン・枠線を描かず、にゃむるたんの全身とフキダシだけを、奥のコマの絵の上に直接重ねる。左上の針フキダシ「コマの外に出れるのにゃ！」もこのコマの組。3〜5コマ目の人物・フキダシ・ホワイトボードは6コマ目に隠れない右側に描く。ほかのコマの枠線は通常どおり"
      - "コマの重なり：3〜5コマ目（大ゴマ・帯・下段）は、ページの左端（x=10mm）から右端まで、コマの座標どおりの横幅で描く。左側の部分は6コマ目に覆われるが、背景の色・集中線・店の棚は左端まで描き、6コマ目の下に回り込ませる。6コマ目は3〜5コマ目の隣に並べず、その上に人物とフキダシだけを重ねる。3〜5コマ目を右半分の幅に縮めてはいけない"

  setting:
    location: "秋葉原の路地裏のジャンクショップ「ヌルポ」の店内"
    time: "昼"
    weather: "晴れ"
    background:
      - "積まれた古いブラウン管モニターと古いPC"
      - "床を這うケーブル"
      - "壁に掛けた小さなホワイトボード"
    props:
      - "ホワイトボード"
    situation: >-
      狭いコマに押しこめられて窮屈ならきもたん。隣のコマのにゃむるたんが、枠をまたいで
      コマの外へ出てきて、コマ重ねとト書きでコマの外に出られることを教える

  characters:
    - name: "にゃむるたん"
      role: >-
        NDMデータモデルの妖精。はつらつで気が強く、自分を相当頭がいいと思っている。
        語尾は「〜にゃ」「〜のにゃ」
    - name: "らきもたん"
      role: >-
        AIのバグから生まれた電脳妖精。超ポジティブ。語尾は「〜のです」

  materials:
    - key: "にゃむるたん"
      type: "character"
      keywords: ["にゃむるたん", "nyamurutan", "立ち絵"]
      note: "黄オレンジのショートヘアに猫耳、[ ]形のヘアクリップ、緑の瞳、大きな鈴、ピンクのミニメイド服、Nマークの白エプロン、黄色ボーダーのニーハイ、肉球手袋・肉球シューズ、リボン付きの尻尾"
    - key: "らきもたん"
      type: "character"
      keywords: ["らきもたん", "rakimotan", "立ち絵"]
      note: "水色のショートボブに大きなアホ毛、赤い文字列の走る黒い大リボン、青いメイド服、Rのエプロン、再生ボタンのベルト、白いニーハイ"
    - key: "ヌルポ店内"
      type: "background"
      keywords: ["ジャンクショップ", "ヌルポ", "背景"]
      note: "積まれたCRTモニターと古いPC、床のケーブル。雑多で温かい"
    - key: "ホワイトボード"
      type: "prop"
      keywords: ["ホワイトボード"]
      note: "店の壁に掛けた小さなホワイトボード。黒いマーカーの手書き文字"

  pages:
    - page: 1
      canvas: {w: 210, h: 297, unit: mm}
      panels:
        - id: 1
          shape: {type: "rect", x: 110, y: 12, w: 90, h: 62}
          bg: 1
          action: >-
            狭いコマ。らきもたんがコマの枠に頭と肩をぎゅうぎゅうに押しつけられ、体を縮めて
            窮屈そうな困り顔。アホ毛が枠に当たって折れ曲がっている。背景は淡い水色のグラデに、
            人物の背後のCRTモニターの山
          assets: ["らきもたん", "ヌルポ店内"]
          figures:
            - name: "らきもたん"
              bbox: {x: 140, y: 16, w: 56, h: 50}
              anchor: "right"
              size: "bust-up"
          bubbles:
            - speaker: "らきもたん"
              text: "コマが狭いのです…"
              shape: "wobbly"
              bbox: {x: 113, y: 16, w: 24, h: 46}
              anchor: "left"
        - id: 2
          shape: {type: "rect", x: 10, y: 12, w: 95, h: 62}
          bg: 1
          action: >-
            にゃむるたんが自分のコマの下の枠線に片足をかけ、枠をまたいでコマの外へ出ようとしている。
            片足と尻尾が下の枠線の外（コマの外の白い余白）に出ている。気合の入った顔。
            背景は淡いピンクのグラデに、人物の背後の古いPCの棚とケーブル
          assets: ["にゃむるたん", "ヌルポ店内"]
          figures:
            - name: "にゃむるたん"
              bbox: {x: 40, y: 16, w: 56, h: 50}
              anchor: "right"
              size: "waist-up"
          bubbles:
            - speaker: "にゃむるたん"
              text: "よいしょっと"
              bbox: {x: 13, y: 16, w: 24, h: 40}
              anchor: "left"
        - id: 3
          shape: {type: "rect", x: 10, y: 79, w: 190, h: 81}
          bg: 0
          no_figures: true
          action: >-
            奥のコマ。ページの左端から右端までの横幅で描き、左側は手前の6コマ目の下に回り込む
            （背景の金のグラデと集中線は左端まで描く。右半分に縮めない）。
            人物は描かない（にゃむるたんは手前の6コマ目に全身で描かれる）。
            背景は得意げな暖かい金のグラデに、左側（6コマ目のにゃむるたんの方）から放射する集中線とキラキラ。
            フキダシはコマの右側に置き、尻尾は左の6コマ目のにゃむるたんの口元へ向ける
          bubbles:
            - speaker: "にゃむるたん"
              text: "実はコマ重ねとト書きで"
              bbox: {x: 150, y: 83, w: 40, h: 72}
              anchor: "right"
        - id: 4
          shape: {type: "rect", x: 10, y: 165, w: 190, h: 53}
          bg: 0
          action: >-
            奥のコマ。ページの左端から右端までの横幅で描き、左側は手前の6コマ目の下に回り込む
            （黄色ベタと集中線は左端まで描く。右半分に縮めない）。らきもたんがコマの右寄りで目を見開いて大絶叫。アホ毛がピンと立ち、ピクセルの
            パーティクルとグリッチノイズが弾ける。コマの左側は6コマ目に隠れるので何も置かない。
            背景は衝撃の黄色ベタに集中線
          assets: ["らきもたん"]
          figures:
            - name: "らきもたん"
              bbox: {x: 118, y: 168, w: 42, h: 48}
              anchor: "right"
              size: "bust-up"
          bubbles:
            - speaker: "らきもたん"
              text: "え、ええ～～！！？！？！？"
              shape: "uniflash"
              bbox: {x: 163, y: 168, w: 34, h: 48}
              anchor: "right"
        - id: 5
          shape: {type: "rect", x: 10, y: 223, w: 190, h: 64}
          bg: 1
          action: >-
            奥のコマ。ページの左端から右端までの横幅で描き、左側は手前の6コマ目の下に回り込む
            （店の棚とクリーム色のグラデは左端まで描く。右半分に縮めない）。
            壁のホワイトボードをコマの右寄りに大きく描く。ボードには横書きで5行の文字を、一字一句そのまま、読みやすくはっきり書く。
            人物は描かない（ホワイトボードを指すのは手前の6コマ目のにゃむるたん）。コマの左側は
            6コマ目に隠れるので何も置かない。背景は淡いクリーム色のグラデに、ホワイトボードの背後のCRTモニターの棚
          no_figures: true
          assets: ["ホワイトボード", "ヌルポ店内"]
          figures:
            - name: "ホワイトボード"
              object: true
              bbox: {x: 112, y: 227, w: 60, h: 57}
              anchor: "center"
          bubbles:
            - speaker: "にゃむるたん"
              text: "やり方はこうなのにゃ！"
              bbox: {x: 173, y: 226, w: 24, h: 58}
              anchor: "right"
          screen_text:
            - text: "ト書きの一番上に書き加えてにゃ"
              bbox: {x: 114, y: 231, w: 56, h: 8}
              orientation: "horizontal"
            - text: "このコマはぶち抜きコマです。"
              bbox: {x: 114, y: 241, w: 56, h: 8}
              orientation: "horizontal"
            - text: "このコマは背景と枠線を描画しない。"
              bbox: {x: 114, y: 251, w: 56, h: 8}
              orientation: "horizontal"
            - text: "人物とフキダシのみを描画して"
              bbox: {x: 114, y: 261, w: 56, h: 8}
              orientation: "horizontal"
            - text: "最前面で他のコマの上に重ねる。"
              bbox: {x: 114, y: 271, w: 56, h: 8}
              orientation: "horizontal"
        - id: 6
          shape: {type: "rect", x: 22, y: 79, w: 86, h: 208}
          bg: -1
          action: >-
            このコマは背景を書かない。枠線を書かない。人物とフキダシのみを描画して他のコマの上に重ねる。
            全身ぶち抜きの見せゴマ。ページ左寄りの縦長の範囲に、3〜5コマ目の上に重ねる一番手前のコマ（1・2コマ目には重ならない）。
            3〜5コマ目の隣に並べるのではなく、左端まで伸びている3〜5コマ目の上に、にゃむるたんを直接重ねる
            （にゃむるたんのまわりからは、奥の3〜5コマ目の絵が見えている）。
            にゃむるたんの全身（頭から肉球シューズまで）。片手を振り上げ、もう片方の肉球の手で右のホワイトボードを
            びしっと指す。得意げなウインク。頭・猫耳・振り上げた手・足先・尻尾は、奥のコマの枠線や境目をまたいで描かれる。
            左上の針フキダシ「コマの外に出れるのにゃ！」もこのコマの組で、他のコマの上に重ねる
          assets: ["にゃむるたん"]
          figures:
            - name: "にゃむるたん"
              bbox: {x: 50, y: 83, w: 56, h: 200}
              anchor: "right"
              size: "full"
          bubbles:
            - speaker: "にゃむるたん"
              text: "コマの外に出れるのにゃ！"
              shape: "uniflash"
              emphasis: "コマの外"
              bbox: {x: 23, y: 83, w: 26, h: 76}
              anchor: "top-left"
            - text: "スキルを入れたAIに伝えてなのにゃ"
              bbox: {x: 25, y: 214, w: 30, h: 66}
              anchor: "bottom-left"
