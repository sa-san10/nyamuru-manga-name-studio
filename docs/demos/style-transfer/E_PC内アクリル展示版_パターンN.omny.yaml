manga:
  schema_name: "Nyamuru Data Model"
  schema_version: 10.3
  meta:
    title: "1億スターほしいのにゃ！"
    author: "sa-san10"
    format: "カラー漫画"
    page_count: 1
    reading_direction: "right-to-left"
    text_orientation: "vertical"
    font: "アンチック体"
    style_notes:
      # ── E版：白い水冷PCの中に、透明アクリルの展示ケースが積み上がっている版 ──
      - "🎭 キャラクターの造形・色・衣装は【リファレンス画像のとおり】に作る。⚠️ リファレンスに無い服・靴・小物・装飾を足さない／あるものを省かない。画風が変わっても識別記号は残し、この画風の材料に翻訳する"
      - "画風: 側面のガラスパネルを外して、白い水冷ゲーミングPCの内部を真横から接写した写真（絵ではなく、実際に組まれた実機を撮影している）。🚨 この作品は『白い』——ケース・ラジエーター・ファン・チューブ・基板・メモリ・拡張カード・ケーブル・電源カバーまで、PCの部品はすべて白で統一されている。背後の壁と床は淡いピンク。撮影は真横・アイレベル・1台のカメラで、展示ケースの中だけがシャープに合っていて、奥のPC内部はわずかにぼける。イラスト・アニメ塗り・線画・CGレンダリングは禁止。⚠️ 黒いスチール・黒い基板・黒いケーブルにしない。⚠️ 虹色RGB・シアン・マゼンタ・紫のけばけばしい発光にしない——光は白く、均一で、静かである"
      - "🖼️ このページは、透明アクリルの展示ケースが何個も、白いPCの内部に積み重ねられているところである。🚨 1コマ＝1個の独立した展示ケースで、それぞれの中にそのコマの情景だけが完結して作り込まれている。ケースは角の丸い透明アクリルの箱で、下に白い台座が付く。🚨 フレームは無い——黒いアルミのアングルも六角ビスも金具も付けない。ケースの大きさはコマに応じて変え（大きいコマには大きいケース）、大きいものを下に、小さいものを上に、少しずつ前後にずらして積み重ねる。⚠️ ケースはPCの内部の高さの1/3〜1/2程度で、何個も積める小ささである"
      - "🐾 白い台座の前面には、この作品のマークが薄いベージュで刻印されている——左に肉球のマーク、右に猫の顔のマーク。台座の縁はわずかに面取りされている"
      - "🏪 コマの枠は、その展示ケースのアクリル板の厚み（小口）と、白い台座の縁である。アクリルの角は丸く、稜線に沿って細く白いハイライトが走り、面には奥のPC内部がうっすら映り込む。枠として線で描かず、透明な箱の構造として厚みと反射と影で見せる"
      - "🧼 展示ケースもPCの部品も新品で清潔である。⚠️ 埃・指紋・擦り傷・汚れ・黄ばみ・使い込んだ跡を描かない（ケースの中に作られた店のジャンク品だけは、模型として汚し塗装がしてある）"
      - "🫧 展示ケースの中は、詰め込まずに空けておく。人物と、そのコマに必要な小道具が1〜2点あるだけで、残りは空間である。⚠️ 小物を敷き詰めない・壁一面に物を積まない。床が広く見えていて、人物の足元に柔らかい影が落ちる"
      - "💧 積み重ねた展示ケースの後ろと横に、白い水冷のループが組んである。次を必ず絵に出す——（a）白いラジエーターと、その手前に並ぶ白い丸ファン3連（羽根の奥が白く光る）（b）白い硬質チューブが直角に曲がり、白い金属のフィッティングでねじ留めされている （c）円形のポンプヘッド（白い円盤の中央に、ベージュの猫の顔のマーク）（d）白い基板に挿さった白いメモリが4枚並び、その下に白い拡張カード。⚠️ どれも無地で、メーカー名やロゴは無い"
      - "💡 光源は白い。PCの内部に細長い縦のLEDラインが1本立っていて、そこと、展示ケースの天面に仕込まれた白色LEDから光が来る。全体が白く均一に明るく、影は柔らかい。⚠️ 色のついた光を当てない。部屋を暗くしない——明るく清潔な撮影である"
      - "🪆 人物は全員、1/12スケールの塗装済み可動アクションフィギュア（全高およそ14cm）である。①全身が硬質プラスチックの成型パーツで、成型色の上から塗装が吹いてある。肌はつや消し、瞳だけ艶がある ②髪は布や繊維ではなく、造形された1個の成型パーツ。毛束ごとに分かれ、毛先がとがっている ③服も布ではなく成型されたプラスチックで、しわ・フリル・縫い目まで彫刻で表現され、塗装で色分けしてある。裾は硬く、風になびかない ④顔は差し替え式の表情パーツで、目・眉・口は印刷、頬の赤みは吹き付け ⑤🚨 関節は隠さず見せる——肩・ひじ・手首・股・ひざ・足首に、肌色の球体関節と細い分割線がはっきり出ている。太ももとふくらはぎの継ぎ目、肘の二重関節も見える（ビス穴だけは無い）⑥手は差し替え式で、手首に丸い接続部の合わせ目がある ⑦台座やスタンドは使わず、自分の足でケースの床に立つか、ケース内の小道具に座る。⚠️ 透明な支柱・背中を支えるアームは描かない ⚠️ 布・植毛・縫い目は使わない——全身がプラスチックである"
      - "🚨 このE版では、OMNY の panels に書かれた size の指定（face / bust-up / waist-up など）を採用しない。展示ケースの中の人形は実在する模型なので、コマが変わっても大きさは変わらない——すべての人物を、すべてのコマで、同じ1/12スケールの全身で写す。顔のクローズアップのコマも、カメラが寄るのではなく、その人形が全身のまま展示ケースの中にいる絵にする。表情は顔パーツの印刷で読み取れる範囲でよい"
      - "🚨 全部のコマがひとつづきの空間である。①すべての展示ケースが同じ1台の白いPCの中に段積みされている ②光は白いLEDから来ていて、全部の段に同じ理屈で当たる ③カメラはPCの正面（パネルを外した側）に1台だけ据えられ、全部の段を同じ視点・同じ高さ・同じレンズで見ている（段ごとにアングルを変えない・別々の写真をはめこんだように見せない）④白いチューブとケーブルが展示ケースの列の後ろを縦に通って、段と段の境目をまたぐ"
      - "🗒️ フキダシは、展示ケースのアクリル面の内側に貼った小さな白い紙として作る。フキダシの形（丸い本体と三角の尻尾がひとつづき）に切り抜いた紙で、太いペンの手書き文字が書かれ、角がわずかに浮いている。⚠️ 尻尾は紙の一部として切り出されたもので、先端は丸みがあってやわらかい——針金・棒・こより・とがった串のような、フィギュアに刺さって見えるものでは絶対に作らない。尻尾の向きだけが話者の口元のほうを指す。caption は台座に貼った細長いラベルシールとして作る。handwritten だけは物にせず、写真に書き込まれた文字として描く"
      - "👀 ページのいちばん下、いちばん下の展示ケースの前か白い電源カバーの上に、この展示を作った2体の1/12フィギュアが小さく立って、展示ケースの中をのぞきこんでいる＝【リファレンス4枚目=リモちゃん／5枚目=あちゃち】。他の人物と同じ規格の可動フィギュアで、台座なしで自分の足で立つ。🚨 省略してはならない"
      - "🚫 商標の回避: この作品は公開リポジトリに掲載される。実在の製品名・型番・企業名・ロゴを絵の中に一切描かない。PCの部品も、店のジャンク品も、名前ではなく形と素材で作る——基板は無地の白い板とヒートシンク／拡張カードは白いバックプレートと丸いファン／ラジエーターとファンは無地／店のジャンクはベージュに黄ばんだ樹脂の箱型本体（前面に薄い四角い差し込み口が2つ縦に並ぶ）／奥行きの深いガラス画面の表示装置／分厚い樹脂のキーボード／剥き出しの緑色の基板。文字を入れるなら、この作品オリジナルの店名『ヌルポ』か、意味のない型番風の記号（JV-0026 / TYPE-B など）だけにする。⚠️ 画面に映すのは OMNY の screen_text に書かれた文字だけで、実在のサービスの画面デザインやロゴは描かない"
      - "✨ らきもたんの『ピクセルの粒』は、展示ケースの中に浮かぶ小さな透明アクリルの立方体として作られている（釣り糸で吊るしてある）。足元が透けて欠けている表現は、足首から下だけクリアパーツで成型されている"
      - "🚨 コマの位置は shape の x 座標が絶対である。x の小さいコマが紙の左、x の大きいコマが紙の右。読み順（右→左）とコマの左右配置を混同してはならない"



  setting:
    location: "秋葉原のジャンクショップ「ヌルポ」店内"
    time: "昼下がり"
    weather: "屋内"
    background:
      - "積み上がったレトロPCとCRTモニターの山"
      - "床を這うケーブル"
    props:
      - "スマートフォン（電卓アプリ）"
    situation: "にゃむるたんが全身の見得切りでGitHubリポジトリのスターをおねだりし、らきもたんが現実（あと9999万9977スター）を突きつけるが、にゃむるたんは超ポジティブに着地する"

  characters:
    - name: "にゃむるたん"
      role: "データモデルの妖精。押しかけ系ヒロイン。リポジトリの主"
    - name: "らきもたん"
      role: "電子の妖精。ツッコミ役。最新機器に触るとバグらせる"

  materials:
    - key: "にゃむるたんの立ち絵"
      type: "character"
      keywords: ["にゃむるたん", "立ち絵", "メイド", "猫耳"]
      note: "黄オレンジ髪・猫耳・ピンクのミニメイド服・肉球手袋・[ ]型ヘアクリップ・首に鈴・猫尻尾に白リボン"
    - key: "らきもたんの立ち絵"
      type: "character"
      keywords: ["らきもたん", "立ち絵", "メイド", "水色"]
      note: "水色ショートボブ・アホ毛・黒リボン（赤いコマンド文字列）・青いレトロメイド服・Rのエプロン・再生ボタンのベルト"
    - key: "ヌルポ店内の背景"
      type: "background"
      keywords: ["ヌルポ", "ジャンクショップ", "店内", "背景", "レトロPC"]
      note: "天井まで積まれた古いパソコンの筐体（ベージュに黄ばんだ樹脂の箱型本体。前面に薄い四角い差し込み口が2つ縦に並ぶ）と、奥行きの深いガラス画面の表示装置の山。床を這うケーブル、薄暗いが温かみのある電子の魔窟"
    - key: "スマホ"
      type: "prop"
      keywords: ["スマホ", "スマートフォン", "電卓"]
      note: "2025年の最新スマートフォン。らきもたんが触るとブルースクリーンになる"

  pages:
    - page: 1
      canvas: {w: 210, h: 297, unit: mm}
      panels:
        # パターンN（タチキリ見得切り）を採用。右の縦長ドン＝にゃむるたんの全身見得切り（右端・下端タチキリ）
        # 【右・縦長ドン】押しかけ登場の見得切り
        - id: 1
          shape: {type: rect, x: 90, y: 10, w: 120, h: 287}
          bg: 2
          bleed: [right, bottom]
          figures:
            - name: "にゃむるたん"
              bbox: {x: 115, y: 45, w: 68, h: 235}
              anchor: "center"
              size: "full"
          assets: ["にゃむるたんの立ち絵", "ヌルポ店内の背景"]
          bubbles:
            - text: "スターくれなのにゃ～！！"
              speaker: "にゃむるたん"
              shape: "flash"
              bbox: {x: 186, y: 15, w: 22, h: 55}
              anchor: "top-right"
            - text: "1億スターくらい欲しいのにゃ～！"
              emphasis: "1億"
              bbox: {x: 92, y: 20, w: 20, h: 56}
              anchor: "top-left"
          action: "全身の見得切りポーズ。片足を踏み出し、肉球手袋の両手を突き上げ、猫尻尾はビシッと立てる。目が星型にキラキラ。背景はジャンクショップ店内を見下ろす構図"

        # 【左上・状況】現在のスター数
        - id: 2
          shape: {type: rect, x: 10, y: 10, w: 75, h: 88}
          bg: 1
          figures:
            - name: "らきもたん"
              bbox: {x: 26, y: 16, w: 38, h: 75}
              anchor: "center"
              size: "waist-up"
          assets: ["らきもたんの立ち絵"]
          bubbles:
            - text: "で、今は何スターなの？"
              speaker: "らきもたん"
              bbox: {x: 66, y: 13, w: 17, h: 42}
              anchor: "top-right"
            - text: "23スターだにゃ！"
              speaker: "にゃむるたん"
              emphasis: "23"
              offscreen: true
              bbox: {x: 12, y: 52, w: 16, h: 40}
              anchor: "bottom-left"
          action: "らきもたんが小首をかしげる。アホ毛がはてなマークの形。背景は日常の淡い水色にジャンク棚のラインを1本"

        # 【左中・反応】現実の残数＋接触バグ
        - id: 3
          shape: {type: rect, x: 10, y: 103, w: 75, h: 88}
          bg: 0
          figures:
            - name: "らきもたん"
              bbox: {x: 24, y: 109, w: 40, h: 74}
              anchor: "center"
              size: "waist-up"
            - name: "スマホ"
              object: true
              bbox: {x: 50, y: 164, w: 22, h: 22}
              anchor: "bottom-right"
          assets: ["らきもたんの立ち絵", "スマホ"]
          bubbles:
            - text: "1億まであと9999万9977スターだよ！？"
              speaker: "らきもたん"
              shape: "flash"
              emphasis: "9999万9977"
              bbox: {x: 66, y: 107, w: 17, h: 56}
              anchor: "top-right"
          screen_text:
            - text: "SYSTEM ERROR"
              bbox: {x: 51, y: 172, w: 20, h: 8}
              orientation: "horizontal"
          action: "電卓アプリで計算した瞬間、触れたスマホがブルースクリーンに（接触バグ）。目がぐるぐる渦巻きに。背景は驚きの黄系ベタにピクセルノイズが散る"

        # 【左下・オチ】超ポジティブ着地
        - id: 4
          shape: {type: rect, x: 10, y: 196, w: 75, h: 91}
          bg: 0
          figures:
            - name: "にゃむるたん"
              bbox: {x: 24, y: 202, w: 40, h: 78}
              anchor: "center"
              size: "bust-up"
          assets: ["にゃむるたんの立ち絵"]
          bubbles:
            - text: "残りは全部伸びしろ！実質もう1億スターなのにゃ！！"
              speaker: "にゃむるたん"
              shape: "flash"
              emphasis: "実質"
              bbox: {x: 66, y: 200, w: 17, h: 64}
              anchor: "top-right"
            - text: "仕様です！"
              speaker: "らきもたん"
              shape: "flash"
              offscreen: true
              bbox: {x: 12, y: 240, w: 15, h: 34}
              anchor: "bottom-left"
          action: "にゃむるたんが拳を突き上げて全力のドヤ顔。背景は歓喜の金〜桃のグラデにキラキラと星の漫符が舞う"
