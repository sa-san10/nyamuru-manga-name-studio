manga:
  schema_name: "Nyamuru Data Model"
  schema_version: 10.3
  meta:
    title: "押しかけ妖精にゃむるたん"
    author: "にゃむるたん © sa-san10 / CC BY 4.0"
    format: "カラー漫画"
    page_count: 2
    reading_direction: "right-to-left"
    text_orientation: "vertical"
    font: "アンチック体"
    style_notes:
      # ### セリフの文字
      - "[const] セリフはOMNY記載どおりの日本語を使用し、全て縦書き（文字は上から下、列は右から左へ送る）で描画する"

      # ### 読み順
      - "[const] ページは右綴じ、コマは右上→左下の順（id 番号の昇順）に読む。同一行に3コマ以上が横に並ぶときも右端のコマ＝その行で最小の id。コマの左右の並びを id の順序と逆にしない"

      # ### ページヘッダー・フッター
      - "[const] 各ページの左上に作品タイトル、右上に『現在/総ページ数』のページ番号（例 3/12）を配置する。ヘッダー要素は上端の高さ10mmの帯（y=0〜10mm）に置く。bleed に top のあるコマを除き、コマ本体（y=10 以降）に被らない。top タチキリのコマと重なる場合はコマ絵の最前面に重ねる。フキダシは付けない（地の紙面に直接描く）"
      - "[const] meta.author に作者名がある場合、各ページの下端中央に作者名を小さく配置する。フッター要素は下端の高さ10mmの帯（下端から10mm以内）に置き、フキダシは付けない（地の紙面に直接描く）。下端まで断ち切られたタチキリコマ（用紙下端まで達するコマ）と重なる場合はコマ絵の最前面に重ねる。author が空・未指定ならフッターは描かない"
      - "[must] ヘッダー・フッターの文字（作品タイトル・ページ番号・作者名）は、タチキリのコマ絵に重なっても読めるコントラストを保つ。必要に応じて文字に細い白フチを付ける"
      - "[style] ヘッダーの文字: 作品タイトルは座標目安 左端から10mm・y=7・左揃え・フォントサイズ約5mm、ページ番号は座標目安 右端から10mm・y=7・右揃え・フォントサイズ約5mm。文字色は黒"
      - "[style] フッターの文字: 座標目安 用紙幅の中央・下端から3mm・中央揃え・フォントサイズ約4mm。文字色は黒"

      # ### 全体トーン
      - "[style] カラー漫画。線画＋ベタ塗り、必要に応じてグラデーション"

      # ### 背景色
      - "[style] bg ごとの背景色——bg:-1 は既定の中間グレー1色のベタ塗り（グラデーション禁止）。ベタ塗り色は action に色指定があればそれで上書きする。bg:0 はシーン・感情に合った背景カラー（ベタ塗り or グラデーション。怒り=赤系/喜び=暖色/驚き=黄系/緊張=紫〜紺/感動=金〜桃/静寂=青系など）を敷く。bg:1 はシーンに合った背景色グラデーションを敷く。bg:0/1 で白一色の背景は禁止——必ずシーンに合った色を敷く"

      # ### 画像サイズ
      - "[style] 画像サイズ: 既定は A4縦（幅210mm × 高297mm）。作品の指定があればそれに従う（コマ・bbox の座標はその用紙サイズを前提に OMNY 側で書かれる）"

      # ### 文字の描き方
      - "[style] 本文フォントはアンチック体（漢字=明朝体、かな=ゴシック体の混植）。心の声・キャプションの枠内も同じくアンチック体"
      - "[style] bubbleのemphasisは、そのフキダシ内で大きな文字にする語。同じフキダシ内で1.3〜1.5倍のサイズで描く"

      # ### 背景カラーの彩度
      - "[style] bg:0/1 の背景カラーは低〜中彩度（くすみ・パステル寄り）に抑える。背景グラデは雰囲気を伝えるための色であり、キャラとセリフより主張してはいけない。高彩度の鮮やかな背景色は、感情の爆発や最大の強調など明確な演出意図があるコマだけに限定する"

      # ### カラースクリプト
      - "[default] 作品全体の背景色は、映像のカラースクリプトのように感情の起伏に沿った色の流れ（ドラマカーブ）として繋がりを意識する。隣接コマの色相差が大きいほど場面転換・感情転換が強く伝わる。照明表現（逆光=シリアス、トップライト=神聖、下から=不穏、光のボケ玉=感動など）も漫符・グラデ選択のヒントにしてよい"

      # ### 版権配慮（サンプル固有）
      - "背景・小物・ポスター・ステッカー・衣服の柄・画面内の作品などに、既存の版権キャラクター・実在の作品名・ブランドロゴ・商標を描かない。それらしい要素が必要な場合は架空のデザイン・架空の名称に置き換える"

  layout_spec: |
    # コマ割り座標系の説明（画像生成AI向け）——タグ付け・トピック別
    # （各項目のタグが優先順位を示す。カスケードは冒頭の「優先順位」を参照）

    ■ タグの意味
    [const]    変更不可。OMNYで上書きできない（衝突時は常に勝つ）
    [must]     衝突したら勝つ（読みやすさ・安全の下限）OMNYで上書き可能
    [panel]    コマ単位（panel / action）で上書きできる既定値。OMNYで上書き可能
    [style]    作品の画風（OMNYの meta.style_notes）で上書きできる既定値。OMNYで上書き可能
    [default]  既定値。上書きの指定がなければこれを使う。OMNYで上書き可能

    ■ 優先順位（強い順・カスケード）
    [const] ＞ omny.yamlのlayout_spec,style_notes ＞ [must] ＞ [panel] ＞ [style] ＞ [default]

    - [const] omny の中では、コマや範囲を名指しした指定（panel / action）が
      meta.style_notes より勝つ

    ## ページ規格

    ### 出力枚数(最重要)
    - [const] Nページの原稿は必ずN枚の別画像として出力する
    - [const] 各画像は用紙1ページ分のみ(用紙サイズは style_notes の画像サイズに従う)
    - [const] 出力は page1, page2, ... と1ページずつ独立した画像で
    - [const] 全ページを同一のピクセル寸法で出力する。1ページ目の寸法を以降のページでも維持する
    禁止事項:
    - [const] 1枚の画像内に複数ページをまとめてはいけない(見開き扱いも禁止)
    - [const] ページ間の余白・並列表示・サムネイル一覧・見開きスプレッドといった発想は全て禁止

    ### キャンバス
    - [const] 原点: 左上を(0,0)。右方向にx増加、下方向にy増加。単位はmm。
    - 用紙サイズは style_notes の画像サイズを参照

    ### ページヘッダー・フッター
    - ページヘッダー・フッター（配置する内容・座標・作画上の扱い）は style_notes を参照する
    - [const] ページ番号の「現在/総ページ数」の総ページ数（N）は OMNY の
      ページ数をそのまま使い、全ページで同じ数を書く。作画の都合で変えない

    ## 生成ワークフロールール

    ### 生成ワークフロー（文字を含めて一発生成）
    - [const] セリフ、フキダシ、モノローグ、作品タイトル、ページ番号を、作画と同時に画像生成AIで描画する
    - [const] 各ページを、セリフとフキダシを含む完成漫画画像として一度に生成する
    - [const] 生成された完成PNGを加工せず、そのまま納品する
    禁止事項:
    - [const] 文字のない原稿を生成して、後からプログラム・画像編集・ローカル処理で写植することは禁止
    - [const] 「これから生成します」という宣言だけで応答を終えてはならない。
      依頼を受けたら、その応答の中で実際に画像を生成し、
      生成した画像のファイルパスを出力して終わる

    ### 員数（コマ・フキダシを勝手に増減しない）
    - [const] OMNY の panels に列挙されたコマは、1ページ内に必ず全て描く。
      コマを増やす・減らす・2つを1つに統合する・1つを分割することはしない。
      コマ数が多くて窮屈に見えても、コマを間引いて調整してはならない
    - [const] 各コマの bubbles に列挙されたフキダシは必ず全て描く。
      セリフを間引く・2つのフキダシを1つにまとめる・要約することはしない
      （長すぎる場合は「長いセリフはフキダシに収まる長さに分割して複数フキダシにする」
      に従って分けるだけで、内容は落とさない）
    禁止事項:
    - [const] コマ・フキダシ・figures の員数を、構図や紙面の都合で調整してはならない。
      入り切らないと判断した場合も員数は守り、その旨を報告する

    ### 出力前の自己検品（作画側が自分で見て直す）
    - [const] 各ページを納品する前に、生成した画像を自分で見て次の項目を確認し、
      直せるものはそのページを再生成してから納品する
    - [const] 確認は推測で答えず、生成した画像を実際に見て答える。
      「指示どおりに描いたはず」ではなく「画像がそうなっているか」で判定する
    - [const] 確認項目:
      1. 枚数と寸法: Nページの原稿がN枚の別画像になっているか。全ページが同一のピクセル寸法か
      2. タチキリ: bleed を宣言した辺に白い余白が1mmも残っていないか
      3. セリフの文字: 各フキダシの文字が OMNY の text と一字一句一致しているか
         （欠落・重複・文字化け・フキダシ外へのはみ出しがないか）
      4. ヘッダーとフッター: 全ページに作品タイトル・ページ番号があり、
         author 指定時はフッターの作者名があるか。いずれもコマ絵に埋もれず読めるか
      5. 読み順: コマが右上→左下（id 昇順）に読める配置になっているか。
         同一行に3コマ以上並ぶとき、右端のコマがその行で最小の id になっているか
      6. 登場人物: figures に列挙した人物・物を全て描いたか。
         figures に無いキャラを描いていないか。no_figures: true のコマが無人か
      7. フキダシのかぶり: フキダシがキャラの顔（figure bbox 上部1/3）に
         重なっていないか。尻尾が話者の口元へ向いているか
      8. 背景の指定: bg:-1 のコマが1色ベタ塗りのみか。bg:0 のコマに
         風景・室内・小物などの具体的背景が描かれていないか
    - [const] 員数（ページ数・コマ数・フキダシ数）は数えて確認し、
      OMNY の記載と一致しているかを数で報告する
    - [const] 再生成しても直らなかった項目は、直せなかった項目名と症状を明記して報告する
    禁止事項:
    - [const] 確認項目を後加工（画像編集・写植・部分修整）で満たしてはならない。
      直すときは必ずそのページを画像生成で再生成する
    - [const] 確認していない項目を「確認済み」と報告してはならない

    ### 素材(assets)
    - [const] 各コマの assets はそのコマで参照する素材(materials の key)の一覧
    - [const] 作画を始める前に、materials の keywords を手がかりに手元の素材ファイル
      （立ち絵・背景・小物）を収集し、各コマの assets に挙がっている素材を
      リファレンスとして参照して描く
    - [default] 背景素材は『そのシーンの美術設定資料』として参照する——場所のデザイン・
      色彩・光・小物の配置を踏襲するためのもの。コマごとにカメラアングル・画角・構図は
      自由に変えて（寄り・引き・あおり・俯瞰・キャラの背後から等、そのコマの演出に合う
      視点で）背景を描き起こし、キャラクターと背景を同じ光源・色温度・影・遮蔽の
      前後関係で一体の絵として描いて馴染ませる
    - [default] assets に対応する画像素材が見つからない場合は、素材待ちで止まらず、
      materials の note と作品のスタイルに合った見た目をその場で自由にデザインしてよい。
      一度デザインした見た目は以後のコマでも一貫して維持する
    禁止事項:
    - [default] 背景素材画像の構図をそのまま複写してキャラクターを上に置く合成は禁止

    ## 表現ルール

    ### ページ間の一貫性（画風のドリフト防止）
    - [const] 1ページ目を作品全体の基準とする。2ページ目以降は、1ページ目と
      同じ画風・同じ線の太さと質・同じ彩度と明度の幅・同じ塗りの厚み・
      同じ情報量（描き込み密度）を維持する
    - [const] キャラクターの造形（頭身・顔のパーツ配置・髪の量・目の描き方）を
      ページ間で変えない。同じキャラが別人に見えてはならない
    - [const] ヘッダー・フッター・枠線・マージン・フキダシ・フォントの見た目は
      全ページで同一にする
    禁止事項:
    - [const] 後半のページで描き込みを省略して簡略化してはならない
      （後半だけ線が細くなる・塗りが薄くなる・背景が減るといった変化を作らない）

    ### 画風を変えてもキャラを保つ
    - [const] 画風を変えるときも、キャラクターの識別記号（特徴的な髪・耳・
      衣装のパーツ・固有色・体の特徴）は省略せず、その画風の描き方に翻訳して残す。
      「その画風では描けないから省く」は認めない——線で描けないなら面で、
      面で描けないなら色で、色で描けないなら形で残す
    - [const] 識別記号は、その画風の物理・材料で説明のつく形に翻訳する
      （例: ドット絵のキャラを実写の世界に置くなら、印刷されたアクリルスタンドとして置く。
      ステンドグラスなら、ガラスは正方形にしか切れないという理由でドットの角を保つ）
    - [const] 画風の指定は、絵の具や画材の名前だけでなく、形・比率・線の性格・
      黒白の設計・情報量の指定として解釈する。画材だけ変えて形が元のままの絵は、
      画風を変えたことにならない

    ### コマ形状
    - [const] shape.type "rect": x, y, w, h で四角コマ(x,yは左上座標)
    - [const] shape.type "polygon": points [[x1,y1],[x2,y2],...] で頂点座標(多角形・対角線カット用)
    - [const] コマ同士が重なるレイアウト(不規則コマ割り)では、id の小さいコマを奥に、大きいコマを手前に重ねて描く(1コマ目が一番奥)。手前のコマは白マージンと枠線ごと奥のコマの上に重なる
    - [const] polygon で指定されたコマは、頂点座標のとおりの多角形として描く。
      四角に近い形・段組みに見える形であっても、矩形に整えてはならない。
      斜辺は必ず斜めの辺として描く

    ### コマ間の間隙とライン（タチキリ）
    - [const] コマの各辺は、bleed の宣言の有無で2通りに描き分ける
    - [style] 通常の辺(bleed なし): 外周に約2〜3mmの白マージンを取り、太さ約1mmの黒い枠線を描く。隣接コマの枠線は共有せず独立して描く
    - [const] タチキリの辺(panel の bleed に left / right / top / bottom の配列で
      宣言される。座標も紙端に一致する: left=x:0、right=x+w:用紙幅、
      top=y:0、bottom=y+h:用紙高)は次の手順で描く:
      1. その辺に白いマージンを1mmも作らない
      2. その辺にコマ枠線を描かない
      3. 絵をその辺の画像の端まで到達させて断ち切る
    - [const] bleed に top が宣言されたコマは、ヘッダー帯のテキストより奥
      （レイヤーの下）にコマを配置し、白マージンなしで上辺（y=0）まで描き切る。
      ヘッダーのテキストはそのコマ絵の最前面に重ねて描く

    ### 背景詳細度(bg)
    - [const] 各コマの bg 値(-1/0/1/2)は背景の描き込み量の指定。bg の指定はコマごとに厳密に守る。背景色・塗りの色味は style_notes を参照
    - [const] bg:-1=背景無描画。1色のベタ塗りのみを敷く。キャラクター・フキダシ・コマ枠・キャラに付随する漫符(頭上の汗・怒りマーク等)は通常どおり描く
    - [const] bg:0=具体的背景なし。背景カラーの上に集中線・漫符・トーン・オーラ・キラキラ等の効果を乗せて、キャラの表情と感情に視線を集中させる
    - [const] bg:1=簡易背景。背景色グラデーションの上に、その場を示す記号的な要素を1〜2点(壁の線・窓枠・机の縁・手前の小物のシルエット等)。手前オブジェクト＋奥は色グラデの奥行き構成も良い
    - [const] bg:2=詳細背景。ロケーションをしっかり描き込む見せゴマ
    - [default] bg:2 のコマは1ページに2コマまで(位置は自由)。この2コマ制限のカウントに bg:-1 は関係しない
    - [const] キャラの足元の接地影は bg で決まる——bg:-1 以外のコマは必ず入れ、bg:-1 のコマは描かない(影は後工程で背景と一緒に足す)
    - [const] bg:-1 の混在は完全に自由(同一ページ内で他の bg 値と混在してよく、全コマ bg:-1 も可)
    禁止事項:
    - [const] bg:-1 のコマでは、1色のベタ塗り以外の背景描写——風景・室内・背景側の効果(集中線・トーン・漫符・オーラ等)——を一切描かない
    - [const] bg:0 のコマに風景・室内・小物などの具体的背景を描き込んではいけない(感情色ベタ/グラデ＋効果表現のみ)

    ### ト書き(action)
    - [const] ト書き（表情・動作）はセリフと分離。actionはキャラクターの表情・動作の
      ト書きで、セリフとは独立して描画に反映する

    ### 演出
    - [panel] キメ台詞・決意表明・啖呵・重要リアクションでは、話者の顔をアップに描く
      (バストアップ〜顔面クローズアップ)。コマサイズも前後より一回り大きく取り、
      余白・集中線・グラデーション背景等でセリフの重みを引き立てる。該当コマの
      action に「顔のアップ」「バストアップ」「決意の表情」等があればそれを優先する
    - [style] 効果線・集中線は action や場面から適切に判断して追加してよい

    ### フキダシ(bubbles)の形と種類
    - [const] 各フキダシの形は shape の指定に従って描く：normal=丸い通常フキダシ／
      thought=もくもく雲形（心の声・想像）／square=角形の枠（内心の独白・回想の語り）／
      caption=枠外キャプション箱（ナレーション・時間経過、コマの隅に角箱）／
      flash=ギザギザ（叫び・強い驚き・電話や機械の音声）／uniflash=ウニフラッシュ＝
      無数の細い針状の線が放射状に伸びるトゲトゲのフキダシ（最大級の絶叫・衝撃の極致。
      monologue: true との併用＝声に出ていない心の中の絶叫ツッコミにも使ってよい）／
      wobbly=よれよれ波線（弱り声・恐怖・ぼそぼそ）／whisper=点線（ひそひそ声）／
      handwritten=フキダシなしの手描き文字
    - [default] shape の指定が無いフキダシは normal（丸）で描く
    - [const] monologue: true のフキダシは心の声（フキダシ単位のフラグ。同じコマに、
      声に出したセリフと心の声のフキダシが同居することがある）
    - [must] 長いセリフはフキダシに収まる長さに分割して複数フキダシにする
    禁止事項:
    - [const] monologue: true のフキダシの中に括弧「（）」の文字は描かない
      （心の声と分かる見た目は shape の指定に任せる）

    ### 画面・看板・紙面の文字(screen_text)
    - [const] 各コマの screen_text は、フキダシではない「画面・看板・紙面など物体の表面の文字」の配列(text / bbox / orientation)
    - [const] フキダシの枠・尻尾を付けず、その物体の表面に直接描く
    - [const] text は一字一句正確に描く(語を落とさない・重複させない)
    - [const] orientation: horizontal は横組み(半角英数は横組みのまま縦書きに崩さない)、vertical は縦書き。省略時は horizontal
    - [const] bbox は描画位置と大きさの目安(mm)

    ### 人物・フキダシのバウンディングボックス（figures / bubbles.bbox）の解釈

    #### 基本原則: 配置の優先順位
    - [const] 配置指定は次の優先チェーンで解釈する。上位と下位が矛盾する場合は常に上位に従う。
      この表が優先順位の正文であり、他の場所にある優先順位の記述はすべてこの表と同一内容の転記である。

      | 優先 | 指定 | 役割 |
      |---|---|---|
      | 1 | action | 演出の最上位指示（「顔のアップ」「背後から」等の明示的な構図指定） |
      | 2 | anchor | 配置命令（厳守）。フキダシのしっぽ向き推定の基準を兼ねる |
      | 3 | 発言順＝立ち位置 | anchor が無いキャラにのみ適用する立ち位置規則（最初の話者が右。anchor があるキャラは anchor が勝つ） |
      | 4 | size | 体格サイズの命令（bbox の寸法に優先） |
      | 5 | bbox | ゾーンと大きさのヒント（拘束なし）。面積確保とかぶり（交差）防止のための領域指定。数mmの誤差は許容 |

    - [must] polygon コマでは、bbox がコマの斜辺からはみ出す場合、コマ内に収まる
      よう内側に寄せて描く（斜辺を跨いで描画しない）。
    禁止事項:
    - [const] bbox をピクセル単位で厳密に再現しようとしてはならない。bbox が伝えるのは
      「コマ内のどのゾーンに・どのくらいの大きさで」であり、構図の自然さ・
      キャラのポーズ・パースの整合が bbox の厳密な再現より優先される。

    #### figures（人物・物の配置）
    - [const] name: そのコマに描く対象の名前（人物ならキャラ名、物なら materials の key）。
      figures に列挙された人物・物は必ず全て描く。
    - [const] figures は人物専用ではない——object: true の figure は物（小道具等）の
      配置指定で、その物（name は materials の key）を bbox / anchor の位置に描く。
      配置（bbox / anchor）だけを持ち——顔ゾーンを持たず、発言順＝立ち位置・
      センター配置の既定など人物向けの規則を適用しない。size / role は指定されない
      （大きさは bbox で示す）。object の無い figure は人物として全規則を適用する。
    - [const] bbox: {x, y, w, h} キャンバス絶対座標(mm)。ゾーンと大きさのヒント（拘束なし）。
      面積確保とかぶり（交差）防止のための領域指定。
      - 縦横比から全身/バストアップの見当をつけ、size の指定と併せて解釈する
      - キャラの頭部は bbox の上部1/3以内に収まるように描く（顔位置の予測可能性
        のため。フキダシ回避判定がこの仮定に依存している）
    - [const] anchor: コマ内の相対位置。right / left / center / top-right / top-left /
      bottom-right / bottom-left の語彙。配置命令であり厳守する。
    - [const] size: 体格サイズの命令。full（全身）/ waist-up（腰から上）/
      bust-up（胸から上）/ face（顔のクローズアップ）。bbox の寸法より優先する。
      hand（手だけ）/ foot（足だけ）/ part（体の一部だけ）は体の一部だけを描く指定
      ——顔を描かないため顔ゾーン（bbox 上部1/3）を持たず、フキダシ回避の対象にしない。
    - [const] role: 人物の役割。main（既定）＝そのコマの主対象。sub＝脇役＝主対象に
      しない。role は役割の宣言であり配置は規定しない——配置と大きさは
      bbox / anchor / size の指定に従う。
    禁止事項:
    - [const] figures に無いキャラをコマ内に描いてはならない（action でコマ外の声と
      指定されたキャラは、フキダシのみでよい＝姿を描かない）
    - [const] 同一コマに複数キャラがいる場合、anchor の相対関係（誰が右で誰が左か）を
      入れ替えてはならない

    #### bubbles の bbox / anchor
    - [const] bbox: フキダシの位置と大きさの目安(mm)。ゾーンと大きさのヒント（拘束なし）で、
      面積確保とかぶり（交差）防止のための領域指定。縦書きテキストが無理なく入る
      サイズに調整してよいが、大きさの序列（大きい bbox のフキダシほど大きく
      描く）は維持する。
    - [const] anchor: コマ内の相対位置。配置命令として厳守する。anchor は配置のみを
      指し、読み順の意味は持たない。
    - [const] bubbles は配列。上から順に読む。一つのコマに複数のフキダシを含めてよい。
      読み順の正は bubbles の配列順のみ（配列順＝右上→左下）。anchor と bbox は
      配置のみを指し、bbox の座標と配列順が食い違って見える場合は配列順を優先し、
      右上→左下が成立する位置に補正する。各フキダシはその話者のすぐ近く
      （頭の上・顔の横など）に配置し、コマ内のフキダシの並びは話者の並び順に合わせる
      （話者は発言順に右から左へ並ぶため、フキダシも自然に右上→左下の読み順になる）。
      話者の近くと右上→左下の読み順が両立しないコマでは配列順＝読み順を優先し、
      話者との対応は尻尾で示す。話者のいないフキダシ（caption・handwritten・
      機械音声など）はコマの隅や空きスペースに置く。
    - [const] 各フキダシの話者は speaker で示す。speaker が省略されたフキダシは、
      同じコマ内の直前のフキダシと同じ話者（ナレーション・効果音は話者なし）。
      尻尾（しっぽ）の有無と向きはフキダシの種類で決まる——①通常発話系
      （normal/thought/flash など・offscreen なし）：尻尾を付け、先端を speaker の
      キャラの口元付近へ向ける ②caption・handwritten・機械音声など話者のいない
      フキダシ：尻尾なし ③offscreen: true のフキダシ＝コマ外の声：尻尾なし
      （話者はコマの外にいて姿も描かない）。bbox はしっぽを含まない本体領域
      なので、しっぽは bbox の外にはみ出してよい。
    禁止事項:
    - [must] フキダシを、いかなるキャラの顔（頭部）にも重ねてはならない。
      figures の bbox 上部1/3 は顔ゾーンとして予約されている。
      size が hand / foot / part の figure と、物の figure（object: true）は
      顔を描かないため顔ゾーンを持たない。
      （フキダシがキャラの胴体・背景に重なるのは許容される＝通常の漫画表現）
    - [default] フキダシの中に「。」を含めない（OMNY の text に「。」が書かれている
      場合は「セリフはOMNY記載どおり」が勝ち、そのまま描く）

    #### フォールバック（figures の書かれ方と人物の扱い）
    - [const] 人物の扱いは figures の書かれ方で決まる——3通り:
      1. figures あり: 列挙されたキャラ全員を bbox / anchor / size の指定のとおり描く
      2. figures 省略: 人物は描く。構図は発言順規則（発言順＝立ち位置、
         最初の話者が右）で自由に決めてよい（bg:0 の感情コマ等）
      3. no_figures: true: 意図的な無人コマ。人物を一人も描かない
         （コマ外の声・背景・効果・小道具だけで構成する）
    - [const] bbox と anchor が矛盾している場合（例: anchor:"left" なのに bbox が
      コマ右半分）は anchor に従い、bbox は大きさの目安としてのみ使う。
    - [panel] コマ内のキャラクターの立ち位置は発言順と連動させる——そのコマで
      最初に発言するキャラ（bubbles 配列の最初の話者）をコマの右側に置き、以降の
      話者は発言順に右から左へ並べる。フキダシも各話者の近くに置かれるため、
      フキダシの読み順とキャラの並びが自然に一致する。この規則は anchor が無い
      キャラにのみ適用する。anchor が指定されたキャラは anchor に従う。actionで
      構図・立ち位置が明示されているコマはそちらを優先。

    ## 作画・演出ルール（参照）
    - 画像サイズ、全体トーン、読み順、セリフの文字、文字の描き方、背景色、背景カラーの彩度、カラースクリプト、ページヘッダー・フッター(座標を含む)のルールは style_notes を参照する

