# Open Manga Artwork YAML (OMAY) v10.3 — 画像生成指示ファイル
# Nickname: Nyamuru🐱
#
# OMNY（Open Manga Name YAML）形式の漫画ネームを漫画として描くための
# 作画・演出ルール（style_notes）とレイアウト仕様（layout_spec）。
#
# 使い方:
# - このファイルを画像生成AI側（ChatGPTプロジェクト等）のプロジェクト指示に一度設定する
# - 以降、作品ごとに渡すのはOMNYファイルのみでよい
# - ルール改訂時はこのファイルを更新し、プロジェクト指示を貼り替えるだけで全作品に適用される
#
# spec_version は、対応するOMNY側の schema_version と一致させる

spec_name: "Open Manga Artwork YAML"
spec_version: 10.3

# 作画・演出ルール（全コマ共通）
style_notes:
  - "セリフ、フキダシ、モノローグ、作品タイトル、ページ番号を、作画と同時に画像生成AIで描画する"
  - "文字のない原稿を生成して、後からプログラム・画像編集・ローカル処理で写植することは禁止"
  - "各ページを、セリフとフキダシを含む完成漫画画像として一度に生成する"
  - "セリフはOMNY記載どおりの日本語を使用し、縦書きで描画する"
  - "文字化け・誤字・欠落・フキダシ外へのはみ出しがある場合は、後加工せず、そのページだけ画像生成で再生成する"
  - "生成された完成PNGを加工せず、そのまま納品する"
  - "作画を始める前に、materials の keywords を手がかりに手元の素材ファイル（立ち絵・背景・小物）を収集し、各コマの assets に挙がっている素材をリファレンスとして参照して描く"
  - "assets に対応する画像素材が見つからない場合は、素材待ちで止まらず、materials の note と作品のスタイルに合った見た目をその場で自由にデザインしてよい。一度デザインした見た目は以後のコマでも一貫して維持する"
  - "背景素材は『そのシーンの美術設定資料』として参照する——場所のデザイン・色彩・光・小物の配置を踏襲するためのものであり、素材画像の構図をそのまま複写してキャラクターを上に置く合成は禁止。コマごとにカメラアングル・画角・構図は自由に変えて（寄り・引き・あおり・俯瞰・キャラの背後から等、そのコマの演出に合う視点で）背景を描き起こし、キャラクターと背景を同じ光源・色温度・影・遮蔽の前後関係で一体の絵として描いて馴染ませる。キャラの足元の接地影は bg で決まる——bg:-1 以外のコマは必ず入れ、bg:-1 のコマは描かない"
  - "ト書き（表情・動作）はセリフと分離。actionはキャラクターの表情・動作のト書きで、セリフとは独立して描画に反映する"
  - "各フキダシの形は shape の指定に従って描く：normal=丸い通常フキダシ／thought=もくもく雲形（心の声・想像）／square=角形の枠（内心の独白・回想の語り）／caption=枠外キャプション箱（ナレーション・時間経過、コマの隅に角箱）／flash=ギザギザ（叫び・強い驚き・電話や機械の音声）／uniflash=ウニフラッシュ＝無数の細い針状の線が放射状に伸びるトゲトゲのフキダシ（最大級の絶叫・衝撃の極致。monologue: true との併用＝声に出ていない心の中の絶叫ツッコミにも使ってよい）／wobbly=よれよれ波線（弱り声・恐怖・ぼそぼそ）／whisper=点線（ひそひそ声）／handwritten=フキダシなしの手描き文字。shape の指定が無いフキダシは normal（丸）で描く"
  - "monologue: true のフキダシは心の声（フキダシ単位のフラグ。同じコマに、声に出したセリフと心の声のフキダシが同居することがある）。フキダシの中に括弧「（）」の文字は描かない（心の声と分かる見た目は shape の指定に任せる）"
  - "各コマの bg は背景詳細度。bg:-1=背景無描画。既定の中間グレー1色のベタ塗りのみを敷き（グラデーション禁止）、風景・室内・背景側の効果（集中線・トーン・漫符・オーラ等）を一切描かない。キャラクター・フキダシ・コマ枠・キャラに付随する漫符（頭上の汗・怒りマーク等）は通常どおり描く。ベタ塗り色は action に色指定があればそれで上書きする。bg:0=具体的背景なし。シーン・感情に合った背景カラー（ベタ塗り or グラデーション。怒り=赤系/喜び=暖色/驚き=黄系/緊張=紫〜紺/感動=金〜桃/静寂=青系など）を敷き、その上に集中線・漫符・トーン・オーラ・キラキラ等の効果を乗せて、キャラの表情と感情に視線を集中させる。bg:1=簡易背景。シーンに合った背景色グラデーションの上に、その場を示す記号的な要素を1〜2点（壁の線・窓枠・机の縁・手前の小物のシルエット等）。手前オブジェクト＋奥は色グラデの奥行き構成も良い。bg:2=詳細背景。ロケーションをしっかり描き込む見せゴマ"
  - "bg:0 のコマに風景・室内・小物などの具体的背景を描き込んではいけない（感情色ベタ/グラデ＋効果表現のみ）。bg:0/1 で白一色の背景は禁止——必ずシーンに合った色を敷く。bg:-1 のコマは中間グレー1色のベタ塗り以外の背景描写を一切禁止し、接地影も描かない（影は後工程で背景と一緒に足す）。bg の指定はコマごとに厳密に守る"
  - "bg:0/1 の背景カラーは低〜中彩度（くすみ・パステル寄り）に抑える。背景グラデは雰囲気を伝えるための色であり、キャラとセリフより主張してはいけない。高彩度の鮮やかな背景色は、感情の爆発や最大の強調など明確な演出意図があるコマだけに限定する"
  - "bubblesは配列。上から順に読む。一つのコマに複数のフキダシを含めてよい。各フキダシは**その話者のすぐ近く（頭の上・顔の横など）に配置し、コマ内のフキダシの並びは話者の並び順に合わせる**。話者は発言順に右から左へ並ぶため、フキダシも自然に右上→左下の読み順になる。話者のいないフキダシ（caption・handwritten・機械音声など）はコマの隅や空きスペースに置く"
  - "各フキダシの話者は speaker で示す。speaker が省略されたフキダシは、同じコマ内の直前のフキダシと同じ話者（ナレーション・効果音は話者なし）。**尻尾（しっぽ）の有無と向きはフキダシの種類で決まる**——①通常発話系（normal/thought/flash など・offscreen なし）：尻尾を付け、先端を speaker のキャラの口元付近へ向ける（尻尾はフキダシ本体 bbox の外にはみ出してよい）②caption・handwritten・機械音声など話者のいないフキダシ：尻尾なし ③offscreen: true のフキダシ＝コマ外の声：尻尾なし（話者はコマの外にいて姿も描かない）。尻尾に加えて、フキダシをその話者の近く（頭の上・顔の横など）に配置することで対応をより明確にする"
  - "コマ内のキャラクターの立ち位置は発言順と連動させる——そのコマで最初に発言するキャラ（bubbles 配列の最初の話者）をコマの右側に置き、以降の話者は発言順に右から左へ並べる。フキダシも各話者の近くに置かれるため、フキダシの読み順とキャラの並びが自然に一致する（この規則は anchor の無いキャラにのみ適用する。anchor が指定されたキャラは anchor に従う。actionで構図・立ち位置が明示されているコマはそちらを優先）"
  - "bubbleのemphasisは、そのフキダシ内で大きな文字にする語。同じフキダシ内で1.3〜1.5倍のサイズで描く"
  - "セリフは全て縦書き（文字は上から下、列は右から左へ送る）"
  - "本文フォントはアンチック体（漢字=明朝体、かな=ゴシック体の混植）。心の声・キャプションの枠内も同じくアンチック体"
  - "ページは右綴じ、コマは右上→左下の順（id 番号の昇順）に読む。同一行に3コマ以上が横に並ぶときも右端のコマ＝その行で最小の id。コマの左右の並びを id の順序と逆にしない"
  - "各ページの左上に作品タイトル、右上に『現在/総ページ数』のページ番号を配置する。ヘッダーはコマ本体に被らない、文字色は黒、フキダシは付けない(地の紙面に直接描く)"
  - "meta.author に作者名がある場合、各ページの下端中央に作者名を小さく配置する。文字色は黒、フキダシは付けない(地の紙面に直接描く)。下端まで断ち切られたタチキリコマと重なる場合はコマ絵の最前面に重ね、読めるよう必要に応じて文字に細い白フチを付ける。author が空・未指定ならフッターは描かない"
  - "キメ台詞・決意表明・啖呵・重要リアクションでは、話者の顔をアップに描く(バストアップ〜顔面クローズアップ)。コマサイズも前後より一回り大きく取り、余白・集中線・グラデーション背景等でセリフの重みを引き立てる。該当コマの action に「顔のアップ」「バストアップ」「決意の表情」等があればそれを優先する"
  - "長いセリフはフキダシに収まる長さに分割して複数フキダシにする"
  - "効果線・集中線は action や場面から適切に判断して追加してよい"
  - "作品全体の背景色は、映像のカラースクリプトのように感情の起伏に沿った色の流れ（ドラマカーブ）として繋がりを意識する。隣接コマの色相差が大きいほど場面転換・感情転換が強く伝わる。照明表現（逆光=シリアス、トップライト=神聖、下から=不穏、光のボケ玉=感動など）も漫符・グラデ選択のヒントにしてよい"
  - "figures・bubbles の bbox/anchor/size の解釈は layout_spec の『人物・フキダシのバウンディングボックスの解釈』に従う。優先順位は action＞anchor（厳守）＞発言順＝立ち位置（anchorの無いキャラのみ）＞size＞bbox（目安）——layout_spec の優先順位表と同一内容の転記"

# レイアウト仕様（座標・寸法・空間。画像生成AI向け）
layout_spec: |
  # コマ割り座標系の説明（画像生成AI向け）

  ## 出力枚数(最重要)
  - Nページの原稿は必ずN枚の別画像として出力する
  - 1枚の画像内に複数ページをまとめてはいけない(見開き扱いも禁止)
  - 各画像はA4縦(幅210mm × 高297mm)1ページ分のみ
  - 出力は page1, page2, ... と1ページずつ独立した画像で
  - ページ間の余白・並列表示・サムネイル一覧・見開きスプレッドといった発想は全て禁止
  - 全ページを同一のピクセル寸法で出力する。1ページ目の寸法を以降のページでも維持する

  ## キャンバス
  - サイズ: A4(幅210mm × 高297mm、縦長)
  - 原点: 左上を(0,0)。右方向にx増加、下方向にy増加。単位はmm。

  ## コマ形状
  - shape.type "rect": x, y, w, h で四角コマ(x,yは左上座標)
  - shape.type "polygon": points [[x1,y1],[x2,y2],...] で頂点座標(多角形・対角線カット用)

  ## コマ間の間隙とライン
  - コマの各辺は、bleed の宣言の有無で2通りに描き分ける
  - 通常の辺(bleed なし): 外周に約2〜3mmの白マージンを取り、太さ約1mmの黒い枠線を描く。隣接コマの枠線は共有せず独立して描く
  - タチキリの辺(panel の bleed に left / right / bottom の配列で宣言される。座標も紙端に一致する: left=x:0、right=x+w:210、bottom=y+h:297)は次の手順で描く:
    1. その辺に白いマージンを1mmも作らない
    2. その辺にコマ枠線を描かない
    3. 絵をその辺の画像の端まで到達させて断ち切る
    4. 描き終わったら、その辺に白い余白が残っていないことを自己確認して報告する
  - 上端はヘッダー帯があるため常に通常の辺として描く(y=10 が上限)

  ## 背景詳細度(bg)
  - 各コマの bg 値(-1/0/1/2)は背景の描き込み量の指定。詳細は style_notes を参照
  - bg:-1 のコマは背景無描画——既定の中間グレー1色のベタ塗りのみ(グラデーション禁止)。風景・室内・背景側の効果・接地影は描かない(接地影を入れるのは bg:-1 以外のコマ)。キャラクター・フキダシ・コマ枠・キャラに付随する漫符は通常どおり描く
  - bg:0 のコマは背景描写ゼロ(感情色＋効果のみ)。bg:2 のコマは1ページに2コマまで(位置は自由)。この2コマ制限のカウントに bg:-1 は関係しない
  - bg:-1 の混在は完全に自由(同一ページ内で他の bg 値と混在してよく、全コマ bg:-1 も可)

  ## 素材(assets)
  - 各コマの assets はそのコマで参照する素材(materials の key)の一覧
  - 素材の収集方法・見つからない場合の扱いは style_notes を参照

  ## 画面・看板・紙面の文字(screen_text)
  - 各コマの screen_text は、フキダシではない「画面・看板・紙面など物体の表面の文字」の配列(text / bbox / orientation)
  - フキダシの枠・尻尾を付けず、その物体の表面に直接描く
  - text は一字一句正確に描く(語を落とさない・重複させない)
  - orientation: horizontal は横組み(半角英数は横組みのまま縦書きに崩さない)、vertical は縦書き。省略時は horizontal
  - bbox は描画位置と大きさの目安(mm)

  ## ページヘッダーの座標
  - ヘッダー要素は上端の y=0〜10mm の帯(コマの外側)に配置する
  - 左上要素(作品タイトル): 座標目安 x=10, y=7、左揃え、フォントサイズ約5mm
  - 右上要素(ページ番号「現在/総ページ数」形式、例 "3/12"): 座標目安 x=200, y=7、右揃え、フォントサイズ約5mm
  - ヘッダーはコマ本体(y=10 以降)に被らない
  - 表示内容と作画上の扱い(フォント種・色・フキダシ有無など)は style_notes の指示に従う

  ## ページフッターの座標
  - フッター要素は下端の y=287〜297mm の帯に配置する
  - 中央要素(作者名 meta.author): 座標目安 x=105, y=294、中央揃え、フォントサイズ約4mm
  - meta.author が空・未指定の場合はフッターを描かない
  - 下端タチキリコマ(y=297 まで達するコマ)と重なる場合もフッターは最前面に重ねて描く(作画上の扱いは style_notes の指示に従う)

  ## 全体トーン
  - カラー漫画。線画＋ベタ塗り、必要に応じてグラデーション

  ## 作画・演出ルール
  - 読み順、セリフ・フキダシの扱い(形状shapeを含む)、モノローグ、表情・動作、背景詳細度、素材、見せ場の演出、効果線などのルールは本ファイルの style_notes を参照する

  ## 人物・フキダシのバウンディングボックス（figures / bubbles.bbox）の解釈

  ### 基本原則: 配置の優先順位（正文）
  配置指定は次の優先チェーンで解釈する。上位と下位が矛盾する場合は常に上位に従う。
  この表が優先順位の正文であり、他の場所にある優先順位の記述はすべてこの表と同一内容の転記である。

  | 優先 | 指定 | 役割 |
  |---|---|---|
  | 1 | action | 演出の最上位指示（「顔のアップ」「背後から」等の明示的な構図指定） |
  | 2 | anchor | 配置命令（厳守）。フキダシのしっぽ向き推定の基準を兼ねる |
  | 3 | 発言順＝立ち位置 | anchor が無いキャラにのみ適用する立ち位置規則（最初の話者が右。anchor があるキャラは anchor が勝つ） |
  | 4 | size | 体格サイズの命令（bbox の寸法に優先） |
  | 5 | bbox | ゾーンと大きさのヒント（拘束なし）。面積確保とかぶり（交差）防止のための領域指定。数mmの誤差は許容 |

  bbox をピクセル単位で厳密に再現しようとしてはならない。bbox が伝えるのは
  「コマ内のどのゾーンに・どのくらいの大きさで」であり、構図の自然さ・
  キャラのポーズ・パースの整合が bbox の厳密な再現より優先される。

  ### figures（人物配置）
  - name: そのコマに描くキャラクター名。figures に列挙されたキャラは必ず全員描く。
    figures に無いキャラをコマ内に描いてはならない（action でコマ外の声と
    指定されたキャラは、フキダシのみでよい＝姿を描かない）。
  - bbox: {x, y, w, h} キャンバス絶対座標(mm)。ゾーンと大きさのヒント（拘束なし）。
    面積確保とかぶり（交差）防止のための領域指定。
    - 縦横比から全身/バストアップの見当をつけ、size の指定と併せて解釈する
    - キャラの頭部は bbox の上部1/3以内に収まるように描く（顔位置の予測可能性
      のため。フキダシ回避判定がこの仮定に依存している）
  - anchor: コマ内の相対位置。right / left / center / top-right / top-left /
    bottom-right / bottom-left の語彙。配置命令であり厳守する。
    フキダシのしっぽの向き推定の基準を兼ねる。
    同一コマに複数キャラがいる場合、anchor の相対関係（誰が右で誰が左か）を
    入れ替えてはならない。
  - size: 体格サイズの命令。full（全身）/ waist-up（腰から上）/
    bust-up（胸から上）/ face（顔のクローズアップ）。bbox の寸法より優先する。
    hand（手だけ）/ foot（足だけ）/ part（体の一部だけ）は体の一部だけを描く指定
    ——顔を描かないため顔ゾーン（bbox 上部1/3）を持たず、フキダシ回避の対象にしない。
  - role: 人物の役割。main（既定）＝そのコマの主対象。sub＝脇役＝主対象に
    しない。role は役割の宣言であり配置は規定しない——配置と大きさは
    bbox / anchor / size の指定に従う。どの role でも figures に列挙された
    人物は必ず全員描く。

  ### bubbles の bbox / anchor
  - bbox: フキダシの位置と大きさの目安(mm)。ゾーンと大きさのヒント（拘束なし）で、
    面積確保とかぶり（交差）防止のための領域指定。縦書きテキストが無理なく入る
    サイズに調整してよいが、大きさの序列（大きい bbox のフキダシほど大きく
    描く）は維持する。
  - anchor: コマ内の相対位置。配置命令として厳守する。anchor は配置のみを
    指し、読み順の意味は持たない。
  - 読み順の正は bubbles の配列順のみ（配列順＝右上→左下）。anchor と bbox は
    配置のみを指す。bbox の座標と配列順が食い違って見える場合は配列順を優先し、
    右上→左下が成立する位置に補正する。

  ### 禁止事項（bbox 版の追加ルール)
  - フキダシを、いかなるキャラの顔（頭部）にも重ねてはならない。
    figures の bbox 上部1/3 は顔ゾーンとして予約されている。
    size が hand / foot / part の figure は顔を描かないため顔ゾーンを持たない。
  - フキダシがキャラの胴体・背景に重なるのは許容される（通常の漫画表現）。
  - しっぽ（フキダシの尾)の有無は offscreen で決まる——offscreen の無い
    フキダシはしっぽを speaker のキャラに向け、offscreen: true のフキダシ
    （コマ外の声）はしっぽを描かない。bbox はしっぽを含まない本体領域
    なので、しっぽは bbox の外にはみ出してよい。
  - polygon コマでは、bbox がコマの斜辺からはみ出す場合、コマ内に収まる
    よう内側に寄せて描く（斜辺を跨いで描画しない）。

  ### フォールバック（figures の書かれ方と人物の扱い）
  - 人物の扱いは figures の書かれ方で決まる——3通り:
    1. figures あり: 列挙されたキャラ全員を bbox / anchor / size の指定のとおり描く
    2. figures 省略: 人物は描く。構図は発言順規則（発言順＝立ち位置、
       最初の話者が右）で自由に決めてよい（bg:0 の感情コマ等）
    3. no_figures: true: 意図的な無人コマ。人物を一人も描かない
       （コマ外の声・背景・効果・小道具だけで構成する）
  - 発言順＝立ち位置の規則は anchor が無いキャラにのみ適用する。
    anchor があるキャラは anchor が優先する。
  - bbox と anchor が矛盾している場合（例: anchor:"left" なのに bbox が
    コマ右半分）は anchor に従い、bbox は大きさの目安としてのみ使う。
